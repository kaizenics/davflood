name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: open
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      - name: Nothing to release
        if: ${{ !steps.open.outputs.pr }}
        run: |
          echo "No feat or fix commits since the last tag — nothing to release."             >> "$GITHUB_STEP_SUMMARY"

      - name: Merge the release PR as the maintainer
        if: ${{ steps.open.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ fromJson(steps.open.outputs.pr).number }}
          AUTHOR_NAME: Niko
          AUTHOR_EMAIL: nicosejohnsoriano@gmail.com
        run: |
          set -euo pipefail

          # asked of the API rather than read from the action's output, so a
          # change to the action's output shape cannot silently break this
          BRANCH=$(gh pr view "$PR" --json headRefName -q .headRefName)
          TITLE=$(gh pr view "$PR" --json title -q .title)

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          git fetch origin "$BRANCH"
          git merge --squash "origin/$BRANCH"
          git commit \
            --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" \
            -m "$TITLE" \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push origin "HEAD:${{ github.ref_name }}"

          gh pr close "$PR" --delete-branch \
            --comment "Squashed onto \`${{ github.ref_name }}\` by the release workflow, authored by the maintainer with github-actions credited as co-author."

      - name: Tag and publish the release
        if: ${{ steps.open.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./.release-please-manifest.json')['.']")
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to publish"
            exit 0
          fi

          # the section for this version only: from its heading to the next one
          NOTES=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 || index($0, "## " ver " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" --title "$TAG" --notes "${NOTES:-See CHANGELOG.md}"

          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"
