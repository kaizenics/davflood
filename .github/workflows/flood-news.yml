name: Refresh flood news

# Every 30 minutes. The app reads the committed JSON same-origin, so this is
# the only place that ever talks to GDELT — one caller instead of one per
# visitor, which is the whole reason the file exists.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flood-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch the news
        env:
          # optional — ReliefWeb refuses unregistered callers, so it stays off
          # until this is set. GDELT alone is enough for the file to be useful.
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: >
          pnpm --filter @davflood/hazard exec tsx scripts/build-flood-news.ts
          ../../apps/web/public/flood-news.json

      - name: Commit if it changed
        run: |
          if git diff --quiet -- apps/web/public/flood-news.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "davflood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/flood-news.json
          git commit -m "chore(news): refresh flood news"
          git push
